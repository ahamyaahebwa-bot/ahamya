<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Booking requests | Cedar Park Dashboard</title>
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="stylesheet" href="dash.css">
    <link rel="stylesheet" href="requests.css">
    <link rel="stylesheet" href="../css/page-entrance.css">
</head>
<body class="dash auth-pending">
<div class="dash-root">

    <header class="dash-top">
        <button class="dash-menu-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="dash-brand" href="booked-dates.html">
            <img src="../images/logo.png" alt="">
            <span>Cedar Park <small>Dashboard</small></span>
        </a>
        <div class="dash-top-right">
            <div class="dash-user">
                <span class="dash-avatar" data-user-initial>A</span>
                <span data-user-email></span>
            </div>
        </div>
    </header>

    <div class="dash-shell">
        <aside class="dash-side" id="dashSide">
            <p class="side-label">Workspace</p>
            <a class="side-link" href="booked-dates.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Booked dates</span></a>
            <a class="side-link active" href="requests.html"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Booking requests</span></a>
            <a class="side-link" href="gallery.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg><span>Gallery</span></a>

            <div class="side-bottom">
                <a class="side-link" href="../index.html"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Back to website</span></a>
                <button class="side-link" type="button" data-signout><svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 8l4 4-4 4M20 12H9"/></svg><span>Sign out</span></button>
            </div>
        </aside>
        <div class="side-backdrop" id="sideBackdrop" hidden></div>

        <main class="dash-main">
            <div class="page-head">
                <h1>Booking requests</h1>
                <p>Requests from the website booking form. Tap one to set the price, deposit and status.</p>
            </div>

            <div class="stats">
                <div class="stat"><p>New (pending)</p><h3 id="stPending">-</h3></div>
                <div class="stat"><p>Awaiting deposit</p><h3 id="stPrice">-</h3></div>
                <div class="stat"><p>Confirmed</p><h3 id="stConfirmed">-</h3></div>
            </div>

            <section class="card">
                <div class="card-head">
                    <div class="tabs" id="reqTabs">
                        <button type="button" class="active" data-f="all">All</button>
                        <button type="button" data-f="pending">Pending</button>
                        <button type="button" data-f="price_agreed">Price agreed</button>
                        <button type="button" data-f="deposit_received">Deposit received</button>
                        <button type="button" data-f="confirmed">Confirmed</button>
                        <button type="button" data-f="declined">Declined</button>
                    </div>
                    <button class="btn" type="button" id="reqRefresh">Refresh</button>
                </div>
                <ul class="req-list" id="reqList"></ul>
                <p class="empty" id="reqEmpty" hidden>No requests here yet.</p>
            </section>
        </main>
    </div>
</div>

<div class="modal-back" id="reqModal" hidden>
    <div class="modal req-modal">
        <h3 id="mName"></h3>
        <p class="req-ref" id="mRef"></p>
        <dl class="req-facts" id="mFacts"></dl>

        <div class="req-form">
            <label>Status
                <select id="mStatus"></select>
            </label>
            <label>Agreed price (UGX)
                <input type="number" id="mPrice" min="0" step="1000" inputmode="numeric">
            </label>
            <label>Deposit received (UGX)
                <input type="number" id="mDeposit" min="0" step="1000" inputmode="numeric">
            </label>
            <label id="mSpaceWrap" hidden>Space to block on the calendar
                <select id="mSpace">
                    <option value="">Choose...</option>
                    <option value="venue">Venue</option>
                    <option value="hall">Hall</option>
                    <option value="both">Venue + Hall</option>
                </select>
            </label>
            <p class="req-balance" id="mBalance"></p>
            <p class="req-sent" id="mSent" hidden></p>
        </div>

        <div class="modal-actions">
            <button class="btn" type="button" id="mClose">Close</button>
            <button class="btn primary" type="button" id="mSave">Save changes</button>
            <button class="btn primary" type="button" id="mApprove" hidden>Approve &amp; send confirmation</button>
        </div>
    </div>
</div>

    <script src="../js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="dash.js"></script>
    <script src="requests.js"></script>
    <script src="../js/page-entrance.js"></script>
</body>
</html>
